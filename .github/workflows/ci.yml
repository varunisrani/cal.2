name: Platewise

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platewise-${{ github.ref }}
  cancel-in-progress: true

env:
  REF_REPOSITORY: apoorvdarshan/fud-ai
  REF_COMMIT: 10e14b67116c52b515d2389621266e32b3a99840

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Fetch the clean-room reference (outside the workspace)
        working-directory: ${{ runner.temp }}
        run: |
          git init --quiet ref
          git -C ref fetch --quiet --depth 1 "https://github.com/${REF_REPOSITORY}.git" "${REF_COMMIT}"
          git -C ref checkout --quiet --detach FETCH_HEAD
          test "$(git -C ref rev-parse HEAD)" = "${REF_COMMIT}"
          echo "PLATEWISE_REF=${RUNNER_TEMP}/ref" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Clean-room guards
        run: pnpm check --require-ref

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm check:bundle

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
