ext {
    // Health Connect needs Android 8.0 (API 26); the client library compiles against API 36.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 35

    // Read by the Capacitor library module (names fixed by Capacitor).
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'

    // Platewise's own native code (app/src/main/java/app/platewise/android/health).
    healthConnectClientVersion = '1.1.0'
    kotlinCoroutinesVersion = '1.10.2'
}
